spring.application.name=finara-backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/finara
spring.datasource.username=postgres
spring.datasource.password=changeme
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP keep connections warm so the first request never waits for pool init
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.initialization-fail-timeout=0

# Spring Cache
spring.cache.type=simple

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Eager servlet init DispatcherServlet initialises at startup, not on first request
spring.mvc.servlet.load-on-startup=1

# File upload (max 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
jwt.secret=finara_super_secret_key_change_in_production_2025
jwt.expiration=86400000

# ML Service
ml.service.url=http://localhost:8000

# Internal service-to-service token (used by ml-service to call /api/service/query)
service.token=${SERVICE_TOKEN:finara_internal_svc_token_2026}

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:80

# Server
server.port=8081