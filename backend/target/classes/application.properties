spring.application.name=finara-backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/finara
spring.datasource.username=postgres
spring.datasource.password=changeme
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File upload (max 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
jwt.secret=finara_super_secret_key_change_in_production_2025
jwt.expiration=86400000

# ML Service
ml.service.url=http://localhost:8000

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:80

# Server
server.port=8080