# ── Finara production stack (GCE VM) ──────────────────────────────────────────
# Runs ONLY backend + ml-service. Postgres is external (Neon), the frontend is
# hosted on Netlify, and the LLM is Google Gemini — so no postgres / frontend /
# ollama containers here.
#
# Secrets come from a .env.prod file on the VM (never committed):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Required vars in .env.prod: NEON_HOST, NEON_PASSWORD, GOOGLE_API_KEY,
# JWT_SECRET, SERVICE_TOKEN, NETLIFY_URL   (see .env.prod.example)

services:

  # ── ML / AI Service (Python + Flask → Gemini) ───────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: finara-ml
    restart: unless-stopped
    environment:
      LLM_PROVIDER: google
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?set GOOGLE_API_KEY in .env.prod}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.5-flash}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env.prod}
      BACKEND_INTERNAL_URL: http://backend:8080
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Backend (Java Spring Boot → Neon) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finara-backend
    restart: unless-stopped
    ports:
      - "8080:8080"          # exposed to the internet so Netlify can proxy /api → here
    environment:
      # Neon Postgres (JDBC form; sslmode=require, channel_binding dropped — the
      # PG JDBC driver negotiates SCRAM channel binding itself).
      SPRING_DATASOURCE_URL: jdbc:postgresql://${NEON_HOST}/neondb?sslmode=require
      SPRING_DATASOURCE_USERNAME: ${NEON_USER:-neondb_owner}
      SPRING_DATASOURCE_PASSWORD: ${NEON_PASSWORD:?set NEON_PASSWORD in .env.prod}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      JWT_EXPIRATION: 86400000
      # Not strictly needed (Netlify proxies same-origin) but harmless belt-and-suspenders.
      CORS_ALLOWED_ORIGINS: ${NETLIFY_URL:-http://localhost:3000}
      SERVER_PORT: "8080"
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env.prod}
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
