services:

  # ── 1. PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: finara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finara
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finara"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 1b. Ollama (local model) ─────────────────────────────────────────────────
  # Only starts with the "local" profile: `docker compose --profile local up`.
  # Skip the profile entirely when using LLM_PROVIDER=google.
  ollama:
    image: ollama/ollama:latest
    container_name: finara-ollama
    profiles: ["local"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot: pull base Gemma and build the custom finara-gemma model, then exit.
  ollama-init:
    image: ollama/ollama:latest
    container_name: finara-ollama-init
    profiles: ["local"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./ml-service/Modelfile:/Modelfile:ro
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull gemma3:4b && ollama create finara-gemma -f /Modelfile && echo 'finara-gemma ready'"
    restart: "no"

  # ── 2. ML / AI Service (Python + Flask) ─────────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: finara-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Provider switch: "ollama" (local, default) or "google" (Gemini API).
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      # Local model (used when LLM_PROVIDER=ollama)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      GEMMA_MODEL: ${GEMMA_MODEL:-finara-gemma}
      # Google Gemini (used when LLM_PROVIDER=google)
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.5-flash}
      SERVICE_TOKEN: finara_internal_svc_token_2026
      BACKEND_INTERNAL_URL: http://backend:8080
    depends_on:
      # Waits for the model build only when the local profile is active;
      # ignored (not pulled in) in google mode.
      ollama-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── 3. Backend (Java Spring Boot) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finara-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finara
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: changeme
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: finara_super_secret_key_change_in_production_2025
      JWT_EXPIRATION: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      SERVER_PORT: "8080"
      SERVICE_TOKEN: finara_internal_svc_token_2026
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── 4. Frontend (React + Nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finara-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  ollama_data:
